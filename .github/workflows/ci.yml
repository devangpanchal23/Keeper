name: CI — Continuous Integration Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Lint, Type Check & Design Regression Guard
  # ----------------------------------------------------------------------------
  validate:
    name: Lint, Type Check & Design Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies (Deterministic Lockfile)
        run: npm ci

      - name: Run Linter (ESLint)
        run: npm run lint -- --max-warnings=262

      - name: Run TypeScript Type Check
        run: npm run type-check

      - name: Enforce 60:30:10 Palette & Design Rules
        run: npm run audit:design

  # ----------------------------------------------------------------------------
  # Job 2: Automated Unit & Core Integration Tests
  # ----------------------------------------------------------------------------
  test:
    name: Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Execute Automated Test Suite
        run: npm test

  # ----------------------------------------------------------------------------
  # Job 3: Security & Dependency Vulnerability Audit
  # ----------------------------------------------------------------------------
  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Dependency Vulnerability Audit
        # Release risk is determined by packages installed in production. The
        # development-only ESLint chain currently includes braces@3.0.3, for
        # which the published advisory has no patched release. Keep the
        # production audit blocking while that upstream toolchain is unpatched.
        run: npm audit --omit=dev --audit-level=high

  # ----------------------------------------------------------------------------
  # Job 4: Next.js Production Build
  # ----------------------------------------------------------------------------
  build:
    name: Production Build Verification
    needs: [validate, test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      # Next.js build cache between CI runs
      - name: Cache Next.js Build Artifacts
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

  # Always publish a compact, unambiguous result even when an upstream gate
  # fails and the dependent production build is skipped.
  report:
    name: CI Results Summary
    if: always()
    needs: [validate, test, security, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish gate results
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          {
            echo '## CI quality gate results'
            echo
            echo '| Gate | Result |'
            echo '| --- | --- |'
            printf '| Lint, type check, design audit | `%s` |\n' "$VALIDATE_RESULT"
            printf '| Automated tests | `%s` |\n' "$TEST_RESULT"
            printf '| Production dependency audit | `%s` |\n' "$SECURITY_RESULT"
            printf '| Production build | `%s` |\n' "$BUILD_RESULT"
            echo
            if [[ "$VALIDATE_RESULT" == success && "$TEST_RESULT" == success && "$SECURITY_RESULT" == success && "$BUILD_RESULT" == success ]]; then
              echo 'All required CI gates passed.'
            else
              echo 'At least one required gate failed or was skipped. Open the corresponding job for its complete log and fix the first failed gate.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
